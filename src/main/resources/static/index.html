<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Interview App</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 640px; margin: 2rem auto; padding: 0 1rem; }
    input, button { padding: .4rem; margin: .2rem 0; }
    li { margin: .3rem 0; }
    .err { color: #b00020; }
  </style>
</head>
<body>
  <h1>Items</h1>
  <form id="form">
    <input id="name" placeholder="Name" required>
    <input id="description" placeholder="Description">
    <button type="submit">Add</button>
  </form>
  <p id="error" class="err"></p>
  <ul id="list"></ul>

  <script>
    const list = document.getElementById('list');
    const errorEl = document.getElementById('error');

    async function load() {
      const items = await (await fetch('/api/items')).json();
      list.innerHTML = '';
      for (const item of items) {
        const li = document.createElement('li');
        // textContent (not innerHTML) so user input can't inject HTML -> XSS
        li.textContent = `#${item.id} ${item.name}` + (item.description ? ` - ${item.description}` : '') + ' ';
        const del = document.createElement('button');
        del.textContent = 'Delete';
        del.onclick = async () => { await fetch(`/api/items/${item.id}`, { method: 'DELETE' }); load(); };
        li.appendChild(del);
        list.appendChild(li);
      }
    }

    document.getElementById('form').addEventListener('submit', async (e) => {
      e.preventDefault();
      errorEl.textContent = '';
      const res = await fetch('/api/items', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          name: document.getElementById('name').value,
          description: document.getElementById('description').value
        })
      });
      if (!res.ok) { const err = await res.json(); errorEl.textContent = err.message + (err.details ? ' ' + JSON.stringify(err.details) : ''); return; }
      e.target.reset();
      load();
    });

    load();
  </script>
</body>
</html>
