spring.application.name=interview-app
server.port=8080

# File-based H2 so data survives restarts. Delete ./data to reset the database.
spring.datasource.url=jdbc:h2:file:./data/devdb;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=

# Schema is derived from entities during the interview (fast iteration).
# Schema is derived from entities during the interview (fast iteration).
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true

# H2 console to inspect data: http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Don't leak stack traces / internals in error responses
server.error.include-message=always
server.error.include-stacktrace=never

logging.level.org.hibernate.SQL=DEBUG
